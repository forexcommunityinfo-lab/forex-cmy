<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200mm"
     height="140mm"
     viewBox="0 0 2362 1654">
  <title>Riconoscimento Annuale Forex_CMY — fronte piatto editabile</title>
  <desc>File grafico frontale per produzione, senza mockup. Inserire il nome nel livello recipient-name.</desc>

  <!-- Fronte piatto completo: logo, firma e testi già inclusi -->
  <image id="flat-production-artwork"
         x="0" y="0"
         width="2362" height="1654"
